pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'ember2d'

// Platform and optional modules (ADR-003). ember-spine is added only if adopted (ADR-021).
include 'ember-core'
include 'ember-desktop'
include 'ember-android'
include 'ember-devtools'
include 'ember-box2d'

// Kits
include 'kits:kit-common'
include 'kits:kit-bullets'
include 'kits:kit-platformer'
include 'kits:kit-topdown'
include 'kits:kit-novel'

// Demos (other demos are added in their phase)
include 'demos:demo-platformer:core'
include 'demos:demo-platformer:desktop'
include 'demos:demo-platformer:android'

include 'demos:demo-shooter:core'
include 'demos:demo-shooter:desktop'
include 'demos:demo-shooter:android'

include 'demos:demo-rpg:core'
include 'demos:demo-rpg:desktop'
include 'demos:demo-rpg:android'

include 'demos:demo-novel:core'
include 'demos:demo-novel:desktop'
include 'demos:demo-novel:android'

// Build tools
include 'tools:android-api-check'   // Android API guard (I-016)
include 'tools:new-game'            // project generator (I-580)
include 'tools:asset-tools'         // manifest and clip generators (I-590)
