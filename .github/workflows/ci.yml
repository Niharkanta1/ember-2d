name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (wrapper validation and caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew build --stacktrace

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: platformer-demo-android-debug
          path: demos/demo-platformer/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  package:
    name: Package desktop builds
    # Release packaging (F-020): pushes to main and manual runs only; each JDK download is about 200 MB.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package Windows and Linux zips
        run: ./gradlew :demos:demo-platformer:packageWinX64 :demos:demo-platformer:packageLinuxX64 --stacktrace

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: platformer-demo-desktop
          path: demos/demo-platformer/desktop/build/construo/dist/*.zip
          if-no-files-found: error
