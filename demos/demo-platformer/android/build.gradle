plugins {
    alias(libs.plugins.android.application)
}

description = 'Platformer demo: Android launcher (F-022).'

android {
    namespace = 'dev.ember2d.demo.platformer.android'
    compileSdk = libs.versions.androidCompileSdk.get().toInteger()

    defaultConfig {
        applicationId = 'dev.ember2d.demo.platformer'
        minSdk = libs.versions.androidMinSdk.get().toInteger()
        targetSdk = libs.versions.androidTargetSdk.get().toInteger()
        versionCode = 1                                 // real scheme with the release build (I-255)
        versionName = project.version.toString()
    }

    buildTypes {
        release {
            // R8 on (F-010 acceptance: prefabs in a minified build). Signed with the debug key until real signing
            // arrives with the release build (I-255).
            minifyEnabled = true
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro',
                    layout.buildDirectory.file('generated/ember-keep-rules.pro').get().asFile
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    sourceSets {
        main {
            // libGDX native libraries, extracted by copyAndroidNatives below.
            jniLibs.srcDirs += [layout.buildDirectory.dir('gdx-natives').get().asFile]
            // Demo assets, shared with the desktop launcher (F-008).
            assets.srcDirs += [rootProject.file('demos/demo-platformer/core/assets')]
        }
    }
}

// R8 keep rules for the components the demo registers (F-010): generated from DemoComponents on every build.
configurations {
    emberKeepRulesClasspath {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        }
    }
}
dependencies {
    emberKeepRulesClasspath project(':demos:demo-platformer:core')
}
def emberKeepRules = tasks.register('emberKeepRules', JavaExec) {
    description = 'Generates R8 keep rules for the registered components (F-010).'
    def out = layout.buildDirectory.file('generated/ember-keep-rules.pro')
    classpath = configurations.emberKeepRulesClasspath
    mainClass = 'dev.ember2d.data.KeepRules'
    args 'dev.ember2d.demo.platformer.DemoComponents', out.get().asFile.path
    inputs.files(classpath)
    outputs.file(out)
}
tasks.named('preBuild') {
    dependsOn emberKeepRules
}

// libGDX ships its Android .so files inside jars; extract them per ABI so they are packed into the APK.
// ABIs: phones (arm64-v8a, armeabi-v7a) and emulators (x86_64). 32-bit x86 is not shipped.
def nativeAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
configurations {
    gdxNatives
}

dependencies {
    implementation project(':demos:demo-platformer:core')
    implementation project(':ember-android')
    coreLibraryDesugaring libs.android.desugar
    nativeAbis.each { abi ->
        gdxNatives variantOf(libs.gdx.platform) { classifier("natives-${abi}") }
    }
}

def copyAndroidNatives = tasks.register('copyAndroidNatives', Sync) {
    description = 'Extracts libGDX native libraries per ABI into build/gdx-natives.'
    into layout.buildDirectory.dir('gdx-natives')
    def nativeJars = configurations.gdxNatives
    nativeAbis.each { abi ->
        into(abi) {
            from { nativeJars.filter { it.name.endsWith("natives-${abi}.jar") }.collect { zipTree(it) } }
            include '*.so'
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    dependsOn copyAndroidNatives
}
