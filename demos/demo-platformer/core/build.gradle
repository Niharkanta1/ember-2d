plugins {
    id 'java-library'
}

description = 'Platformer demo: game code shared by all launchers.'

dependencies {
    testImplementation testFixtures(project(':ember-core'))
    api project(':ember-core')
    api project(':kits:kit-common')
    api project(':kits:kit-platformer')

    // SPIKE S-02: headless libGDX for loading Tiled maps in tests
    testImplementation libs.gdx.backend.headless
    testRuntimeOnly variantOf(libs.gdx.platform) { classifier('natives-desktop') }
}
