plugins {
    alias(libs.plugins.android.application)
}

description = 'RPG demo: Android launcher (F-022).'

// Version code from MAJOR.MINOR.PATCH (I-255): 0.1.0 -> 100, 1.2.3 -> 10203. A suffix such as -SNAPSHOT is ignored.
static int emberVersionCode(String version) {
    def m = version =~ /^(\d+)\.(\d+)\.(\d+)(-.*)?$/
    if (!m.matches()) {
        throw new GradleException("Version '${version}' must look like MAJOR.MINOR.PATCH[-SUFFIX] for the Android version code")
    }
    int major = m.group(1) as int, minor = m.group(2) as int, patch = m.group(3) as int
    if (minor > 99 || patch > 99) {
        throw new GradleException("Version '${version}': MINOR and PATCH must be below 100 for the Android version code")
    }
    return major * 10000 + minor * 100 + patch
}

// Upload-key signing (I-255) from Gradle properties kept outside the repository (~/.gradle/gradle.properties or
// ORG_GRADLE_PROJECT_ember.signing.* in CI). Without them the release build is signed with the debug key.
def signingKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].collectEntries {
    [(it): providers.gradleProperty("ember.signing.${it}").orNull]
}
def hasUploadKey = signingKeys.values().every { it != null && !it.isEmpty() }

android {
    namespace = 'dev.ember2d.demo.rpg.android'
    compileSdk = libs.versions.androidCompileSdk.get().toInteger()

    defaultConfig {
        applicationId = 'dev.ember2d.demo.rpg'
        minSdk = libs.versions.androidMinSdk.get().toInteger()
        targetSdk = libs.versions.androidTargetSdk.get().toInteger()
        versionCode = emberVersionCode(project.version.toString())
        versionName = project.version.toString()
    }

    signingConfigs {
        if (hasUploadKey) {
            upload {
                storeFile = file(signingKeys.storeFile)
                storePassword = signingKeys.storePassword
                keyAlias = signingKeys.keyAlias
                keyPassword = signingKeys.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 with the generated keep rules (F-010); the mapping file is build/outputs/mapping/release/mapping.txt.
            minifyEnabled = true
            signingConfig = hasUploadKey ? signingConfigs.upload : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro',
                    layout.buildDirectory.file('generated/ember-keep-rules.pro').get().asFile
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    sourceSets {
        main {
            // libGDX native libraries, extracted by copyAndroidNatives below.
            jniLibs.srcDirs += [layout.buildDirectory.dir('gdx-natives').get().asFile]
            // Demo assets, shared with the desktop launcher (F-008).
            assets.srcDirs += [rootProject.file('demos/demo-rpg/core/assets')]
        }
    }
}

// R8 keep rules for the components the demo registers (F-010): generated from RpgComponents on every build.
configurations {
    emberKeepRulesClasspath {
        canBeConsumed = false
        canBeResolved = true
        attributes {
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        }
    }
}
dependencies {
    emberKeepRulesClasspath project(':demos:demo-rpg:core')
}
def emberKeepRules = tasks.register('emberKeepRules', JavaExec) {
    description = 'Generates R8 keep rules for the registered components (F-010).'
    def out = layout.buildDirectory.file('generated/ember-keep-rules.pro')
    classpath = configurations.emberKeepRulesClasspath
    mainClass = 'dev.ember2d.data.KeepRules'
    args 'dev.ember2d.demo.rpg.RpgComponents', out.get().asFile.path
    inputs.files(classpath)
    outputs.file(out)
}
tasks.named('preBuild') {
    dependsOn emberKeepRules
}
// When the Ink stories are compiled in the same build, they are written before the assets are merged.
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Assets') }.configureEach {
    mustRunAfter ':demos:demo-rpg:core:compileInk'
}

// libGDX ships its Android .so files inside jars; extract them per ABI so they are packed into the APK.
// ABIs: phones (arm64-v8a, armeabi-v7a) and emulators (x86_64). 32-bit x86 is not shipped.
def nativeAbis = ['arm64-v8a', 'armeabi-v7a', 'x86_64']
configurations {
    gdxNatives
}

dependencies {
    implementation project(':demos:demo-rpg:core')
    implementation project(':ember-android')
    coreLibraryDesugaring libs.android.desugar
    nativeAbis.each { abi ->
        gdxNatives variantOf(libs.gdx.platform) { classifier("natives-${abi}") }
        gdxNatives variantOf(libs.gdx.freetype.platform) { classifier("natives-${abi}") }   // FreeType fonts (I-140)
    }
}

def copyAndroidNatives = tasks.register('copyAndroidNatives', Sync) {
    description = 'Extracts libGDX native libraries per ABI into build/gdx-natives.'
    into layout.buildDirectory.dir('gdx-natives')
    def nativeJars = configurations.gdxNatives
    nativeAbis.each { abi ->
        into(abi) {
            from { nativeJars.filter { it.name.endsWith("natives-${abi}.jar") }.collect { zipTree(it) } }
            include '*.so'
        }
    }
}

tasks.matching { it.name.contains('merge') && it.name.contains('JniLibFolders') }.configureEach {
    dependsOn copyAndroidNatives
}

// Release bundles signed with the debug key cannot be uploaded to Google Play (I-255).
tasks.matching { it.name == 'bundleRelease' || it.name == 'assembleRelease' }.configureEach {
    doFirst {
        if (!hasUploadKey) {
            logger.warn("${name}: no upload key (ember.signing.* properties); signed with the debug key - fine for testing, "
                    + "not for Google Play.")
        }
    }
}
