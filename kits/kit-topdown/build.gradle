plugins {
    id 'java-library'
}

description = 'Ember2D genre kit: top-down movement, shooter and rpg packages (F-016, F-017).'

dependencies {
    testImplementation testFixtures(project(':ember-core'))
    api project(':kits:kit-common')
    api project(':kits:kit-bullets')
    implementation libs.gdx.ai   // behind the AI adapter (dev.ember2d.kit.topdown.ai); gdx-ai types do not leak (I-330)
}
