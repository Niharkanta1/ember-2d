# Version pins for Ember2D. Only dependencies listed in documents/TECHNICAL_DECISIONS.md may appear here.
# Pinned in I-000 (2026-11-25) from Maven Central / Google Maven: latest stable releases.

[versions]
gdx = "1.14.2"
agp = "9.5.2"
desugarJdkLibs = "2.1.5"
junit = "6.1.3"
assertj = "3.27.7"

# Android SDK levels (minSdk is a placeholder; the final value is decided in I-015).
androidCompileSdk = "36"  # gdx-backend-android 1.14.2 pulls androidx.core 1.17.0, which requires 36+
androidMinSdk = "21"

[libraries]
gdx-core = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
gdx-backend-android = { module = "com.badlogicgames.gdx:gdx-backend-android", version.ref = "gdx" }
android-desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
