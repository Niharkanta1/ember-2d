# Version pins for Ember2D. Only dependencies listed in documents/TECHNICAL_DECISIONS.md may appear here.
# Pinned in I-000 (2026-11-25) from Maven Central / Google Maven: latest stable releases.

[versions]
gdx = "1.14.2"
agp = "9.5.2"
desugarJdkLibs = "2.1.5"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
construo = "2.3.0"
# Dev tools (I-160, F-018): imgui-java needs LWJGL 3.4.1; every desktop build is pinned to it (S-01).
imgui = "1.92.7.1"
lwjgl = "3.4.1"
# Kit AI (I-330, F-016): steering and pathfinding behind the kit-topdown AI adapter; approved for download 2026-11-27.
gdxAi = "1.8.2"
# Ink runtime (S-03, I-420, F-021): dialogue and novels; approved for download 2026-11-27.
bladeInk = "1.2.1"

# Android SDK levels. minSdk 23 (Android 6) decided in I-015 (ADR-015).
androidCompileSdk = "36"  # gdx-backend-android 1.14.2 pulls androidx.core 1.17.0, which requires 36+
androidTargetSdk = "36"
androidMinSdk = "23"

[libraries]
gdx-core = { module = "com.badlogicgames.gdx:gdx", version.ref = "gdx" }
gdx-platform = { module = "com.badlogicgames.gdx:gdx-platform", version.ref = "gdx" }
gdx-backend-lwjgl3 = { module = "com.badlogicgames.gdx:gdx-backend-lwjgl3", version.ref = "gdx" }
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
imgui-binding = { module = "io.github.spair:imgui-java-binding", version.ref = "imgui" }
imgui-lwjgl3 = { module = "io.github.spair:imgui-java-lwjgl3", version.ref = "imgui" }
imgui-natives-windows = { module = "io.github.spair:imgui-java-natives-windows", version.ref = "imgui" }
imgui-natives-linux = { module = "io.github.spair:imgui-java-natives-linux", version.ref = "imgui" }
imgui-natives-macos = { module = "io.github.spair:imgui-java-natives-macos", version.ref = "imgui" }
gdx-backend-headless = { module = "com.badlogicgames.gdx:gdx-backend-headless", version.ref = "gdx" }
gdx-backend-android = { module = "com.badlogicgames.gdx:gdx-backend-android", version.ref = "gdx" }
gdx-freetype = { module = "com.badlogicgames.gdx:gdx-freetype", version.ref = "gdx" }
gdx-freetype-platform = { module = "com.badlogicgames.gdx:gdx-freetype-platform", version.ref = "gdx" }
gdx-box2d = { module = "com.badlogicgames.gdx:gdx-box2d", version.ref = "gdx" }                       # ember-box2d (F-006B, I-500)
gdx-box2d-platform = { module = "com.badlogicgames.gdx:gdx-box2d-platform", version.ref = "gdx" }
gdx-ai = { module = "com.badlogicgames.gdx:gdx-ai", version.ref = "gdxAi" }
blade-ink = { module = "com.bladecoder.ink:blade-ink", version.ref = "bladeInk" }
android-desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
construo = { id = "io.github.fourlastor.construo", version.ref = "construo" }
