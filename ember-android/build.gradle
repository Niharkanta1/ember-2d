plugins {
    alias(libs.plugins.android.library)
}

description = 'Ember2D Android platform: launcher support, lifecycle, context loss (F-022).'

android {
    namespace = 'dev.ember2d.android'
    compileSdk = libs.versions.androidCompileSdk.get().toInteger()

    defaultConfig {
        // Android 6; decided in I-015 (ADR-015).
        minSdk = libs.versions.androidMinSdk.get().toInteger()
        consumerProguardFiles 'consumer-rules.pro'   // applied to every game's release build (R8)
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
}

dependencies {
    api project(':ember-core')
    api libs.gdx.backend.android
    // Gamepads (F-005, I-530): the Android backend gdx-controllers picks; its keep rule is in consumer-rules.pro.
    implementation libs.gdx.controllers.android
    coreLibraryDesugaring libs.android.desugar
}
